  <rect y="28" width="600" height="8" fill="#192126" />
  <line x1="0" y1="36" x2="600" y2="36" stroke="#3f4a3d" stroke-width="1" />
  <circle cx="20" cy="18" r="4.5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="4.5" fill="#ffbd2e" />
  <circle cx="52" cy="18" r="4.5" fill="#27c93f" />

  <text x="75" y="22" fill="#becaba" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500">
    crm.enterprise.internal/pipeline/analytics
  </text>
  <rect x="500" y="10" width="84" height="16" rx="3" fill="#1377cd" />
