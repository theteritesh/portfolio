  <text x="402" y="174" fill="#dbe3ec" font-family="Inter, sans-serif" font-size="11" font-weight="500">CloudSync Ltd.</text>
  <text x="402" y="190" fill="#a2c9ff" font-family="JetBrains Mono, monospace" font-size="10">$84,000</text>
  <rect x="496" y="170" width="60" height="16" rx="8" fill="#1377cd" fill-opacity="0.3" stroke="#a2c9ff" stroke-width="0.8" />
  <text x="504" y="181" fill="#a2c9ff" font-family="JetBrains Mono, monospace" font-size="8">Proposal</text>

  <!-- Deal 3 -->
  <rect x="392" y="208" width="172" height="46" rx="4" fill="#192126" stroke="#3f4a3d" stroke-width="1" />
  <text x="402" y="226" fill="#dbe3ec" font-family="Inter, sans-serif" font-size="11" font-weight="500">Vortex FinTech</text>
  <text x="402" y="242" fill="#d3bbff" font-family="JetBrains Mono, monospace" font-size="10">$62,500</text>
  <rect x="496" y="222" width="60" height="16" rx="8" fill="#5b21b5" fill-opacity="0.3" stroke="#d3bbff" stroke-width="0.8" />
  <text x="510" y="233" fill="#d3bbff" font-family="JetBrains Mono, monospace" font-size="8">Audit</text>

  <!-- Bottom CTA -->
  <rect x="392" y="266" width="172" height="34" rx="4" fill="#232b31" stroke="#3f4a3d" stroke-width="1" />
  <text x="430" y="287" fill="#becaba" font-family="JetBrains Mono, monospace" font-size="10">+ Export CSV Report</text>
