  <text x="402" y="138" fill="#7bdb80" font-family="JetBrains Mono, monospace" font-size="10">$120,000</text>
  <rect x="496" y="118" width="60" height="16" rx="8" fill="#238636" fill-opacity="0.3" stroke="#7bdb80" stroke-width="0.8" />
