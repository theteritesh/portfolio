  <line x1="40" y1="190" x2="340" y2="190" stroke="#192126" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="40" y1="230" x2="340" y2="230" stroke="#192126" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="40" y1="270" x2="340" y2="270" stroke="#3f4a3d" stroke-width="1" />

  <!-- Area Fill & Smooth Curve Line -->
  <path d="M 40 250 Q 80 230, 120 210 T 200 170 T 270 190 T 340 140 L 340 270 L 40 270 Z" fill="url(#area-grad)" />
  <path d="M 40 250 Q 80 230, 120 210 T 200 170 T 270 190 T 340 140" fill="none" stroke="#a2c9ff" stroke-width="2.5" />

  <!-- Data points on curve -->
