      <stop offset="0%" stop-color="#0c141a" />
      <stop offset="100%" stop-color="#151d22" />
    </linearGradient>
    <linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1377cd" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1377cd" stop-opacity="0" />
