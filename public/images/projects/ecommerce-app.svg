<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bg-grad-eco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c141a" />
      <stop offset="100%" stop-color="#151d22" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192126" />
      <stop offset="100%" stop-color="#232b31" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="600" height="340" fill="url(#bg-grad-eco)" rx="8" />

  <!-- Window Header -->
  <rect width="600" height="36" fill="#192126" rx="8" />
  <rect y="28" width="600" height="8" fill="#192126" />
  <line x1="0" y1="36" x2="600" y2="36" stroke="#3f4a3d" stroke-width="1" />
  <circle cx="20" cy="18" r="4.5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="4.5" fill="#ffbd2e" />
  <circle cx="52" cy="18" r="4.5" fill="#27c93f" />

  <text x="75" y="22" fill="#becaba" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500">
    https://store.cloudstack.internal/checkout/v3
  </text>
  <rect x="496" y="10" width="88" height="16" rx="3" fill="#1377cd" />
  <text x="504" y="22" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600">STRIPE READY PR</text>

  <!-- Product Catalog Grid (3 Cards) -->
