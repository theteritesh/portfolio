  <text x="228" y="214" fill="#a2c9ff" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">$89/mo</text>
  <rect x="326" y="200" width="46" height="20" rx="3" fill="#238636" />
  <text x="336" y="214" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="9">+ Add</text>

  <!-- Product 3 -->
  <rect x="408" y="52" width="168" height="204" rx="6" fill="url(#card-grad)" stroke="#3f4a3d" stroke-width="1" />
  <rect x="420" y="64" width="144" height="90" rx="4" fill="#151d22" stroke="#3f4a3d" stroke-width="0.5" />
  <circle cx="492" cy="109" r="24" fill="#5b21b5" fill-opacity="0.3" stroke="#d3bbff" stroke-width="1" />
