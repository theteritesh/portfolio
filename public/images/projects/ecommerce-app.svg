  <rect x="24" y="52" width="168" height="204" rx="6" fill="url(#card-grad)" stroke="#3f4a3d" stroke-width="1" />
  <!-- Product image placeholder box -->
  <rect x="36" y="64" width="144" height="90" rx="4" fill="#151d22" stroke="#3f4a3d" stroke-width="0.5" />
  <circle cx="108" cy="109" r="24" fill="#238636" fill-opacity="0.2" stroke="#7bdb80" stroke-width="1" />
  <text x="108" y="114" fill="#7bdb80" font-family="JetBrains Mono, monospace" font-size="16" text-anchor="middle">⚡</text>

  <text x="36" y="174" fill="#dbe3ec" font-family="Inter, sans-serif" font-size="12" font-weight="600">Cloud Microservice Pod</text>
  <text x="36" y="190" fill="#899485" font-family="Inter, sans-serif" font-size="10">High IOPS dedicated node</text>
  <text x="36" y="214" fill="#7bdb80" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">$49/mo</text>
  <rect x="134" y="200" width="46" height="20" rx="3" fill="#238636" />
  <text x="144" y="214" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="9">+ Add</text>

  <!-- Product 2 -->
  <rect x="216" y="52" width="168" height="204" rx="6" fill="url(#card-grad)" stroke="#3f4a3d" stroke-width="1" />
  <rect x="228" y="64" width="144" height="90" rx="4" fill="#151d22" stroke="#3f4a3d" stroke-width="0.5" />
  <circle cx="300" cy="109" r="24" fill="#1377cd" fill-opacity="0.2" stroke="#a2c9ff" stroke-width="1" />
  <text x="300" y="114" fill="#a2c9ff" font-family="JetBrains Mono, monospace" font-size="16" text-anchor="middle">☁</text>

  <text x="228" y="174" fill="#dbe3ec" font-family="Inter, sans-serif" font-size="12" font-weight="600">Managed PostgreSQL</text>
