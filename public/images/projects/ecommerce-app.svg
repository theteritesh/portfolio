  <text x="420" y="174" fill="#dbe3ec" font-family="Inter, sans-serif" font-size="12" font-weight="600">Enterprise VPC Transit</text>
  <text x="420" y="190" fill="#899485" font-family="Inter, sans-serif" font-size="10">Direct Connect 10Gbps</text>
  <text x="420" y="214" fill="#d3bbff" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">$199/mo</text>
  <rect x="518" y="200" width="46" height="20" rx="3" fill="#238636" />
  <text x="528" y="214" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="9">+ Add</text>

  <!-- Bottom Checkout Status Bar -->
  <rect x="24" y="268" width="552" height="50" rx="6" fill="#151d22" stroke="#3f4a3d" stroke-width="1" />
  <circle cx="48" cy="293" r="14" fill="#238636" fill-opacity="0.3" stroke="#7bdb80" stroke-width="1" />
  <text x="48" y="297" fill="#7bdb80" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">✓</text>
  <text x="74" y="292" fill="#dbe3ec" font-family="Inter, sans-serif" font-size="11" font-weight="600">Stripe Webhook Confirmed: #ch_9021aef4</text>
  <text x="74" y="306" fill="#899485" font-family="JetBrains Mono, monospace" font-size="9">Order fulfillment pipeline dispatched in 380ms</text>
  <rect x="460" y="278" width="104" height="28" rx="4" fill="#238636" />
  <text x="512" y="296" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" text-anchor="middle">Receipt Sent</text>
