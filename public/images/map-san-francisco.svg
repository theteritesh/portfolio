<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <linearGradient id="map-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c141a" />
      <stop offset="100%" stop-color="#151d22" />
    </linearGradient>
    <pattern id="map-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#232b31" stroke-width="0.8" />
    </pattern>
  </defs>

  <rect width="500" height="240" fill="url(#map-bg)" rx="6" />
  <rect width="500" height="240" fill="url(#map-grid)" rx="6" />

  <!-- Coastlines / Bay Shape -->
  <path d="M 0 40 Q 120 70, 200 40 T 360 80 T 500 30 L 500 0 L 0 0 Z" fill="#070f15" />
  <path d="M 340 100 Q 380 140, 420 120 T 500 160 L 500 240 L 300 240 Q 280 180, 340 100 Z" fill="#070f15" />

  <!-- Road / Transit Arteries -->
  <path d="M 40 240 L 160 140 L 260 110 L 400 90 L 500 80" fill="none" stroke="#3f4a3d" stroke-width="2.5" />
  <path d="M 120 0 L 160 90 L 180 180 L 200 240" fill="none" stroke="#3f4a3d" stroke-width="2" />
  <path d="M 260 110 L 320 200 L 410 240" fill="none" stroke="#1377cd" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Bridge representation (Golden Gate / Bay Bridge) -->
  <line x1="260" y1="110" x2="340" y2="100" stroke="#7bdb80" stroke-width="2.5" />
  <circle cx="260" cy="110" r="3" fill="#7bdb80" />
  <circle cx="340" cy="100" r="3" fill="#7bdb80" />

  <!-- Pulse Location Pin for San Francisco HQ -->
  <circle cx="210" cy="130" r="28" fill="#7bdb80" fill-opacity="0.15" />
  <circle cx="210" cy="130" r="16" fill="#7bdb80" fill-opacity="0.3" />
  <circle cx="210" cy="130" r="6" fill="#7bdb80" stroke="#0c141a" stroke-width="2" />

  <!-- Location Label Card -->
  <rect x="130" y="80" width="160" height="34" rx="4" fill="#192126" stroke="#3f4a3d" stroke-width="1" />
  <circle cx="144" cy="97" r="4" fill="#7bdb80" />
  <text x="156" y="96" fill="#dbe3ec" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">San Francisco, CA</text>
  <text x="156" y="108" fill="#899485" font-family="Inter, sans-serif" font-size="9">37.7749° N, 122.4194° W</text>

  <!-- Coordinates Watermark -->
  <text x="20" y="222" fill="#899485" font-family="JetBrains Mono, monospace" font-size="9">DEV-GIS // SFO-TRANSIT-ZONE-01</text>
  <text x="400" y="222" fill="#7bdb80" font-family="JetBrains Mono, monospace" font-size="9">REMOTE FRIENDLY</text>
</svg>
